<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297">
  <!-- Hoja A4 de pegatinas redondas de 30 mm para poner ENCIMA de la pegatina NFC de 25 mm.
       Imprímela en papel adhesivo de vinilo (o pide que la impriman) y recorta por la línea.
       Fila 1 cafetera · fila 2 calefacción · fila 3 salida · fila 4 normas · fila 5 lavadora · fila 6 genérica -->
  <defs>
    <g id="base">
      <circle r="15" fill="#1f3f9e"/>
      <circle r="13.6" fill="none" stroke="#ffffff" stroke-width=".35" stroke-dasharray=".8 .8" opacity=".7"/>
      <text y="10" font-family="Inter,Arial,sans-serif" font-size="3.1" font-weight="800" fill="#fff" text-anchor="middle" letter-spacing=".25">TÓCAME</text>
    </g>
    <g id="coffee" fill="none" stroke="#fff" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M-6 -4h9v6a4 4 0 0 1-4 4h-1a4 4 0 0 1-4-4z"/><path d="M3 -2h1.6a2 2 0 0 1 0 4H3"/><path d="M-4 -8c0 1 1 1 1 2M-1 -8c0 1 1 1 1 2"/></g>
    <g id="heat" fill="none" stroke="#fff" stroke-width="1.2" stroke-linecap="round"><path d="M-1.6 -8a1.6 1.6 0 0 1 3.2 0v8a3.4 3.4 0 1 1-3.2 0z"/><path d="M0 -3v5"/><path d="M4 -7h2M4 -4h2M4 -1h2"/></g>
    <g id="door" fill="none" stroke="#fff" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round"><path d="M-5 6v-14h8v14"/><path d="M3 -8l3 1.5v13L3 6"/><circle cx="1" cy="-1" r=".5" fill="#fff"/><path d="M-8 6h15"/></g>
    <g id="rules" fill="none" stroke="#fff" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"><rect x="-5" y="-8" width="10" height="14" rx="1.5"/><path d="M-2.6 -4h5.2M-2.6 -1h5.2M-2.6 2h3.2"/></g>
    <g id="wash" fill="none" stroke="#fff" stroke-width="1.2"><rect x="-6" y="-8" width="12" height="14" rx="1.5"/><circle cy="0.5" r="3.6"/><path d="M-4 -5.6h2" stroke-linecap="round"/></g>
    <g id="info" fill="none" stroke="#fff" stroke-width="1.3" stroke-linecap="round"><circle cy="-1" r="6.5"/><path d="M0 -1.5v4"/><circle cx="0" cy="-4.4" r=".5" fill="#fff"/></g>
  </defs>
  <text x="105" y="12" font-family="Inter,Arial,sans-serif" font-size="4" fill="#5d6b7b" text-anchor="middle">Pegatinas 30 mm · imprime al 100 % (sin "ajustar a página") · corta por el borde</text>
  <g font-family="Inter,Arial,sans-serif">
    <!-- 6 filas x 5 columnas, separación 38 mm -->
    <g transform="translate(29 40)"><use href="#base"/><use href="#coffee"/></g>
    <g transform="translate(67 40)"><use href="#base"/><use href="#coffee"/></g>
    <g transform="translate(105 40)"><use href="#base"/><use href="#coffee"/></g>
    <g transform="translate(143 40)"><use href="#base"/><use href="#coffee"/></g>
    <g transform="translate(181 40)"><use href="#base"/><use href="#coffee"/></g>
    <g transform="translate(29 80)"><use href="#base"/><use href="#heat"/></g>
    <g transform="translate(67 80)"><use href="#base"/><use href="#heat"/></g>
    <g transform="translate(105 80)"><use href="#base"/><use href="#heat"/></g>
    <g transform="translate(143 80)"><use href="#base"/><use href="#heat"/></g>
    <g transform="translate(181 80)"><use href="#base"/><use href="#heat"/></g>
    <g transform="translate(29 120)"><use href="#base"/><use href="#door"/></g>
    <g transform="translate(67 120)"><use href="#base"/><use href="#door"/></g>
    <g transform="translate(105 120)"><use href="#base"/><use href="#door"/></g>
    <g transform="translate(143 120)"><use href="#base"/><use href="#door"/></g>
    <g transform="translate(181 120)"><use href="#base"/><use href="#door"/></g>
    <g transform="translate(29 160)"><use href="#base"/><use href="#rules"/></g>
    <g transform="translate(67 160)"><use href="#base"/><use href="#rules"/></g>
    <g transform="translate(105 160)"><use href="#base"/><use href="#rules"/></g>
    <g transform="translate(143 160)"><use href="#base"/><use href="#rules"/></g>
    <g transform="translate(181 160)"><use href="#base"/><use href="#rules"/></g>
    <g transform="translate(29 200)"><use href="#base"/><use href="#wash"/></g>
    <g transform="translate(67 200)"><use href="#base"/><use href="#wash"/></g>
    <g transform="translate(105 200)"><use href="#base"/><use href="#wash"/></g>
    <g transform="translate(143 200)"><use href="#base"/><use href="#wash"/></g>
    <g transform="translate(181 200)"><use href="#base"/><use href="#wash"/></g>
    <g transform="translate(29 240)"><use href="#base"/><use href="#info"/></g>
    <g transform="translate(67 240)"><use href="#base"/><use href="#info"/></g>
    <g transform="translate(105 240)"><use href="#base"/><use href="#info"/></g>
    <g transform="translate(143 240)"><use href="#base"/><use href="#info"/></g>
    <g transform="translate(181 240)"><use href="#base"/><use href="#info"/></g>
  </g>
  <text x="105" y="280" font-family="Inter,Arial,sans-serif" font-size="3.4" fill="#5d6b7b" text-anchor="middle">Cafetera · Calefacción · Salida · Normas · Lavadora · Información general</text>
</svg>
