<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#1f3f9e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pedidos">
<title>Pedidos · TocToc</title>
<link rel="manifest" href="pedidos.webmanifest">
<link rel="apple-touch-icon" href="assets/app-icon-180.png">
<link rel="icon" type="image/png" href="assets/app-icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Young+Serif&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
<style>
  html,body{overscroll-behavior-y:contain}
  body{background:var(--glaze);-webkit-tap-highlight-color:transparent;padding-bottom:env(safe-area-inset-bottom)}
  .bar{position:sticky;top:0;z-index:10;background:var(--cobalt);color:#fff;padding:calc(env(safe-area-inset-top) + 12px) 16px 0}
  .bar-row{display:flex;align-items:center;gap:12px;max-width:760px;margin:0 auto}
  .bar h1{color:#fff;font-size:24px;margin:0;flex:1;display:flex;align-items:center;gap:10px}
  .bar h1 svg{width:30px;height:30px}
  .live{display:inline-flex;align-items:center;gap:6px;font:600 12.5px var(--ui);color:#dfe6fb}
  .live i{width:8px;height:8px;border-radius:50%;background:#9aa4c2}
  .live.on i{background:#4ade80;box-shadow:0 0 0 0 rgba(74,222,128,.6);animation:pulse 2.4s var(--ease-out) infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(74,222,128,.55)}100%{box-shadow:0 0 0 10px rgba(74,222,128,0)}}
  @media (prefers-reduced-motion:reduce){.live.on i{animation:none}}
  .iconbtn{width:42px;height:42px;border-radius:12px;border:0;background:rgba(255,255,255,.12);color:#fff;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;transition:transform 160ms var(--ease-out),background-color 160ms ease}
  .iconbtn:active{transform:scale(.94)}
  .iconbtn[aria-pressed="true"]{background:var(--albero);color:var(--albero-ink)}
  .kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:760px;margin:14px auto 0}
  .kpi{background:rgba(255,255,255,.1);border-radius:12px;padding:10px 12px}
  .kpi span{font-size:12px;color:#dfe6fb;display:block}
  .kpi b{font-family:var(--display);font-weight:400;font-size:22px;color:#fff}
  .tabs{display:flex;gap:4px;max-width:760px;margin:12px auto 0;overflow-x:auto;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tabs button{flex:none;border:0;background:transparent;color:#dfe6fb;font:600 14.5px var(--ui);padding:10px 12px 12px;cursor:pointer;border-bottom:3px solid transparent;display:inline-flex;gap:6px;align-items:center}
  .tabs button[aria-selected="true"]{color:#fff;border-bottom-color:var(--albero)}
  .tabs .n{background:rgba(255,255,255,.18);border-radius:99px;padding:1px 7px;font-size:12px}
  main{max-width:760px;margin:0 auto;padding:12px 12px 32px}
  .hint{display:flex;gap:12px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px;font-size:14px}
  .hint .icon{color:var(--cobalt);width:22px;height:22px}
  .hint button{margin-left:auto}
  .order{display:grid;grid-template-columns:1fr auto;gap:4px 12px;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-top:8px;cursor:pointer;font:inherit;color:inherit;transition:transform 160ms var(--ease-out),box-shadow 200ms ease}
  .order:active{transform:scale(.985)}
  .order.new{animation:arrive .9s var(--ease-out)}
  @keyframes arrive{0%{box-shadow:0 0 0 3px var(--albero);transform:translateY(-6px);opacity:0}30%{opacity:1;transform:none}100%{box-shadow:0 0 0 0 rgba(233,178,58,0)}}
  @media (prefers-reduced-motion:reduce){.order.new{animation:none;box-shadow:0 0 0 2px var(--albero)}}
  .order .who{font-weight:700;color:var(--cobalt-ink);font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .order .amt{font-family:var(--display);font-size:20px;color:var(--cobalt-ink);text-align:right}
  .order .meta{font-size:13.5px;color:var(--muted);display:flex;gap:8px;align-items:center;min-width:0}
  .order .meta .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .order .meta .icon{flex:none}
  .order .meta .icon{width:15px;height:15px}
  .order .side{text-align:right}
  .empty{text-align:center;padding:48px 16px;color:var(--muted)}
  .empty .icon{width:44px;height:44px;color:var(--cobalt-line);margin-bottom:8px}
  /* Hoja de detalle */
  dialog.sheet{position:fixed;inset:auto 0 0 0;margin:0 auto;width:100%;max-width:640px;max-height:92dvh;border:0;padding:0;border-radius:22px 22px 0 0;background:#fff;color:var(--ink);overflow:auto;transform:translateY(100%);transition:transform 320ms cubic-bezier(.32,.72,0,1),overlay 320ms allow-discrete,display 320ms allow-discrete}
  dialog.sheet[open]{transform:none}
  @starting-style{dialog.sheet[open]{transform:translateY(100%)}}
  dialog.sheet.closing{transform:translateY(100%);transition-duration:200ms;transition-timing-function:var(--ease-out)}
  dialog.sheet::backdrop{background:rgba(13,27,71,.45);transition:opacity 300ms ease}
  @media (prefers-reduced-motion:reduce){dialog.sheet{transition:none}}
  @media (min-width:700px){dialog.sheet{inset:0;margin:auto;border-radius:22px;max-height:88dvh}}
  .grab{width:44px;height:5px;border-radius:99px;background:var(--line);margin:10px auto 0}
  .sheet-body{padding:8px 20px calc(24px + env(safe-area-inset-bottom))}
  .sheet h2{font-size:26px;margin:8px 0 2px}
  .acts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:16px 0}
  .acts a,.acts button{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 4px;border-radius:14px;background:var(--cobalt-soft);color:var(--cobalt-deep);text-decoration:none;font:600 12.5px var(--ui);border:0;cursor:pointer;transition:transform 160ms var(--ease-out)}
  .acts a:active,.acts button:active{transform:scale(.95)}
  .acts .icon{width:22px;height:22px}
  .blk{border-top:1px solid var(--line);padding:14px 0}
  .blk h3{font-family:var(--ui);font-weight:700;font-size:12.5px;letter-spacing:.05em;color:var(--muted);margin:0 0 6px}
  .line{display:flex;justify-content:space-between;gap:12px;padding:3px 0}
  .addr{display:flex;gap:10px;align-items:flex-start}
  .addr p{margin:0;flex:1}
  .copy{border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:6px 11px;font:600 13px var(--ui);color:var(--cobalt);cursor:pointer;display:inline-flex;gap:6px;align-items:center;flex:none}
  .copy:active{transform:scale(.96)}
  .stack{display:grid;gap:10px;margin-top:6px}
  .stack .btn{width:100%;padding:15px}
  .login{max-width:420px;margin:40px auto;padding:0 8px}
</style>
</head>
<body>
<header class="bar">
  <div class="bar-row">
    <h1><span class="logo-mark"></span>Pedidos</h1>
    <span class="live" id="live"><i></i><span>…</span></span>
    <button class="iconbtn" id="bell" aria-pressed="false" aria-label="Activar avisos"></button>
    <button class="iconbtn" id="reload" aria-label="Actualizar"></button>
  </div>
  <div class="kpis" id="kpis" hidden></div>
  <div class="tabs" role="tablist" id="tabs" hidden></div>
</header>
<main id="main"><p class="empty">Cargando…</p></main>
<dialog class="sheet" id="sheet" aria-labelledby="sh-title"><div class="grab"></div><div class="sheet-body" id="sheet-body"></div></dialog>
<div class="toast" id="toast" role="status"></div>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script src="assets/icons.js"></script>
<script src="assets/app.js"></script>
<script>
const { C, $, esc, money } = TS;
TS.demoBanner(); TS.brand();
$('#bell').innerHTML = TSI.svg('bell'); $('#reload').innerHTML = TSI.svg('refresh');

const TABS = [['pending', 'Por cobrar'], ['paid', 'Por enviar'], ['shipped', 'Enviados'], ['all', 'Todos']];
const ST = { pending: ['Por cobrar', 'warn'], paid: ['Por enviar', 'ok'], shipped: ['Enviado', ''], cancelled: ['Cancelado', 'danger'] };
const PM = { bizum: ['bizum', 'Bizum'], transfer: ['bank', 'Transferencia'], paypal: ['card', 'Tarjeta / PayPal'], shopify: ['card', 'Shopify'] };
let orders = [], tab = 'pending', seen = new Set(), current = null, unsub = null, swReg = null;
const toast = (m) => { const t = $('#toast'); t.textContent = m; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 2200); };
const prodName = (id) => (C.PRODUCTS.find(p => p.id === id) || {}).name || id;
const ago = (iso) => { const s = (Date.now() - Date.parse(iso)) / 1000; if (s < 60) return 'ahora'; if (s < 3600) return `hace ${Math.floor(s / 60)} min`; if (s < 86400) return `hace ${Math.floor(s / 3600)} h`; const d = new Date(iso); return d.toLocaleDateString('es-ES', { day: 'numeric', month: 'short' }); };
const digits = (p) => String(p || '').replace(/\D/g, '');
const waNum = (p) => { const d = digits(p); return d.length === 9 ? '34' + d : d; };

// ---------- avisos ----------
if ('serviceWorker' in navigator && location.protocol !== 'file:') navigator.serviceWorker.register('sw.js').then(r => swReg = r).catch(() => {});
function bellState() { const on = 'Notification' in window && Notification.permission === 'granted'; $('#bell').setAttribute('aria-pressed', on); $('#bell').setAttribute('aria-label', on ? 'Avisos activados' : 'Activar avisos'); }
$('#bell').onclick = async () => {
  if (!('Notification' in window)) return toast('Este navegador no permite avisos. Instala la app primero.');
  const r = await Notification.requestPermission(); bellState();
  toast(r === 'granted' ? 'Avisos activados' : 'Avisos bloqueados en los ajustes del navegador');
  unlockAudio();
};
let actx; function unlockAudio() { try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); actx.resume(); } catch (e) {} }
function ding() {
  try { if (!actx) return; const t = actx.currentTime; [880, 1320].forEach((f, i) => { const o = actx.createOscillator(), g = actx.createGain(); o.frequency.value = f; o.type = 'sine'; g.gain.setValueAtTime(0, t + i * .14); g.gain.linearRampToValueAtTime(.18, t + i * .14 + .02); g.gain.exponentialRampToValueAtTime(.001, t + i * .14 + .35); o.connect(g).connect(actx.destination); o.start(t + i * .14); o.stop(t + i * .14 + .4); }); } catch (e) {}
  if (navigator.vibrate) navigator.vibrate([120, 60, 120]);
}
function notify(o) {
  ding();
  const title = `Pedido nuevo · ${money(o.total)}`, body = `${o.name} · ${(PM[o.payment_method] || [, o.payment_method])[1]}`;
  if ('Notification' in window && Notification.permission === 'granted') {
    const opts = { body, tag: o.ref, icon: 'assets/app-icon-192.png', badge: 'assets/app-icon-192.png', data: { url: 'pedidos.html#' + o.ref } };
    if (swReg) swReg.showNotification(title, opts); else new Notification(title, opts);
  }
  toast(`${title} de ${o.name.split(' ')[0]}`);
}
document.addEventListener('pointerdown', unlockAudio, { once: true });

// ---------- datos ----------
async function load(fresh) {
  const prev = new Set(orders.map(o => o.ref));
  orders = await TS.listOrders();
  if (fresh && prev.size) orders.filter(o => !prev.has(o.ref)).forEach(o => { notify(o); seen.add('new:' + o.ref); });
  render();
}
function live(on, text) { $('#live').classList.toggle('on', on); $('#live').lastElementChild.textContent = text; }

async function boot() {
  const u = await TS.currentUser();
  if (!u || !(await TS.isAdmin())) return loginView();
  $('#kpis').hidden = false; $('#tabs').hidden = false;
  await load(false);
  if (location.hash.length > 1) { const o = orders.find(x => x.ref === location.hash.slice(1)); if (o) open(o); }
  unsub = TS.subscribeOrders(async (ev) => {
    if (ev.type === 'insert' && ev.order && !orders.some(o => o.ref === ev.order.ref)) { orders.unshift(ev.order); seen.add('new:' + ev.order.ref); notify(ev.order); render(); }
    else await load(true);
  });
  live(true, TS.DEMO ? 'Demo en directo' : 'En directo');
  // Respaldo: si el móvil durmió la conexión, recarga al volver
  document.addEventListener('visibilitychange', () => { if (!document.hidden) load(true); });
  setInterval(() => { if (!document.hidden) load(true); }, 60000);
  bellState();
}
function loginView() {
  $('#main').innerHTML = `<div class="card login"><h2 style="font-size:28px;margin:0 0 6px">Entra para ver tus pedidos</h2><p class="muted">${TS.DEMO ? 'Demo: usa <b>admin@demo.test</b>.' : 'Con el email que pusiste en la tabla <code>admins</code>. Te llegará un enlace.'}</p>
    <form id="lf"><label for="em">Email</label><input id="em" type="email" required autocomplete="email" value="${TS.DEMO ? 'admin@demo.test' : ''}"><p id="lm" class="muted" role="status"></p><button class="btn" style="width:100%">Entrar</button></form></div>`;
  live(false, 'Sin conexión');
  $('#lf').onsubmit = async (e) => { e.preventDefault(); const r = await TS.login($('#em').value.trim()); if (r.demo) { $('#main').innerHTML = ''; boot(); } else $('#lm').textContent = 'Revisa tu email y abre el enlace en este mismo móvil.'; };
}

// ---------- pintar ----------
function render() {
  const count = (s) => s === 'all' ? orders.length : orders.filter(o => o.status === s).length;
  const today = orders.filter(o => new Date(o.created_at).toDateString() === new Date().toDateString()).length;
  const due = orders.filter(o => o.status === 'pending').reduce((s, o) => s + Number(o.total), 0);
  $('#kpis').innerHTML = `<div class="kpi"><span>Hoy</span><b>${today}</b></div><div class="kpi"><span>Por cobrar</span><b>${money(due)}</b></div><div class="kpi"><span>Por enviar</span><b>${count('paid')}</b></div>`;
  $('#tabs').innerHTML = TABS.map(([k, t]) => `<button role="tab" data-t="${k}" aria-selected="${k === tab}">${t}<span class="n">${count(k)}</span></button>`).join('');
  document.querySelectorAll('#tabs button').forEach(b => b.onclick = () => { tab = b.dataset.t; render(); });
  const list = orders.filter(o => tab === 'all' || o.status === tab);
  const standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone;
  const hint = !standalone && location.protocol !== 'file:' ? `<div class="hint">${TSI.svg('phone')}<span>Instálala en el móvil: menú del navegador → <b>Añadir a pantalla de inicio</b>.</span>${deferred ? '<button class="btn small" id="inst">Instalar</button>' : ''}</div>` : '';
  const emptyTxt = { pending: 'No hay pagos pendientes.', paid: 'Nada por enviar. ¡Al día!', shipped: 'Aún no has enviado nada.', all: 'Todavía no hay pedidos. Cuando alguien compre, aparecerá aquí al momento.' }[tab];
  $('#main').innerHTML = hint + (list.length ? list.map(o => {
    const [ic, pm] = PM[o.payment_method] || ['card', o.payment_method];
    const items = (o.items || []).map(i => `${i.qty}× ${esc(prodName(i.id))}`).join(', ');
    return `<button class="order ${seen.has('new:' + o.ref) ? 'new' : ''}" data-r="${esc(o.ref)}">
      <span class="who">${esc(o.name)}</span><span class="amt">${money(o.total)}</span>
      <span class="meta">${TSI.svg(ic)}<span class="t">${pm} · ${items}</span></span><span class="side"><span class="pill ${ST[o.status][1]}">${ST[o.status][0]}</span></span>
      <span class="meta">${esc(o.ref)} · ${ago(o.created_at)}</span><span></span></button>`;
  }).join('') : `<div class="empty">${TSI.svg('box')}<p>${emptyTxt}</p></div>`);
  document.querySelectorAll('.order').forEach(b => b.onclick = () => open(orders.find(o => o.ref === b.dataset.r)));
  const ib = $('#inst'); if (ib) ib.onclick = async () => { deferred.prompt(); deferred = null; render(); };
  setTimeout(() => seen.forEach(k => k.startsWith('new:') && seen.delete(k)), 1200);
}
let deferred = null; addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); deferred = e; render(); });

// ---------- detalle ----------
function mail(o, kind) {
  const first = o.name.split(' ')[0];
  const t = {
    pay: [`Tu pedido ${o.ref}`, `Hola, ${first}:\n\nGracias por tu pedido ${o.ref} (${money(o.total)}). Para pagar:\n· Bizum al ${C.BIZUM_PHONE || '[tu móvil]'}\n· o transferencia a ${C.IBAN} (titular: ${C.IBAN_HOLDER})\nConcepto: ${o.ref}\n\nEn cuanto llegue el pago fabricamos tu kit y sale en 2-3 días laborables.\n\nUn saludo`],
    paid: [`Pago recibido · ${o.ref}`, `Hola, ${first}:\n\nHemos recibido el pago de tu pedido ${o.ref}. ¡Gracias! Ya estamos preparando tu kit; te mandamos el seguimiento cuando salga.\n\nUn saludo`],
    ship: [`Tu kit va de camino · ${o.ref}`, `Hola, ${first}:\n\n¡Tu kit va de camino! Seguimiento: ${o.tracking || '[número]'}\n\nCuando llegue, entra en ${TS.baseUrl()}panel.html con este email y escribe el código de la tarjeta que va en la caja. Son 3 minutos.\n\nUn saludo`]
  }[kind];
  return `mailto:${encodeURIComponent(o.email)}?subject=${encodeURIComponent(t[0])}&body=${encodeURIComponent(t[1])}`;
}
function open(o) {
  current = o; history.replaceState(null, '', '#' + o.ref);
  const [ic, pm] = PM[o.payment_method] || ['card', o.payment_method];
  const tel = digits(o.phone);
  const maps = 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(o.address);
  let actions = '';
  if (o.status === 'pending') actions = `<p class="muted" style="margin:0">Comprueba en tu banco que ha llegado un ${pm.toLowerCase()} de <b>${money(o.total)}</b> con el concepto <b>${esc(o.ref)}</b>.</p>
    <div class="stack"><button class="btn" data-do="paid">${TSI.svg('check')}Marcar como pagado</button><a class="btn ghost" href="${mail(o, 'pay')}">Reenviar instrucciones de pago</a><button class="btn ghost" data-do="cancelled" style="color:var(--danger)">Cancelar pedido</button></div>`;
  else if (o.status === 'paid') actions = `<div class="stack"><a class="btn ghost" href="admin.html" target="_blank" rel="noopener">${TSI.svg('tag')}Crear kit e imprimir (panel de vendedor)</a>
    <div><label for="trk" style="margin-top:4px">Nº de seguimiento</label><input id="trk" value="${esc(o.tracking || '')}" placeholder="PK123456789ES" autocapitalize="characters" spellcheck="false"></div>
    <button class="btn" data-do="shipped">${TSI.svg('truck')}Marcar como enviado</button></div>`;
  else if (o.status === 'shipped') actions = `<div class="line"><span>Seguimiento</span><b>${esc(o.tracking || '—')}</b></div><div class="stack"><a class="btn ghost" href="${mail(o, 'ship')}">Reenviar email de envío</a></div>`;
  $('#sheet-body').innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><span class="pill ${ST[o.status][1]}">${ST[o.status][0]}</span><button class="copy" id="close" aria-label="Cerrar">${TSI.svg('x')}Cerrar</button></div>
    <h2 id="sh-title">${esc(o.name)}</h2><p class="muted" style="margin:0">${esc(o.ref)} · ${new Date(o.created_at).toLocaleString('es-ES', { dateStyle: 'medium', timeStyle: 'short' })}</p>
    <div class="acts">
      ${tel ? `<a href="tel:${tel}">${TSI.svg('phone')}Llamar</a><a href="https://wa.me/${waNum(o.phone)}" target="_blank" rel="noopener">${TSI.svg('chat')}WhatsApp</a>` : ''}
      <a href="mailto:${esc(o.email)}">${TSI.svg('mail')}Email</a><a href="${maps}" target="_blank" rel="noopener">${TSI.svg('pin')}Mapa</a>
    </div>
    <div class="blk"><h3>ENVÍO · ${esc((C.SHIPPING_LABELS || {})[o.zone] || o.zone || '')}</h3><div class="addr"><p>${esc(o.address)}</p><button class="copy" data-copy="${esc(o.name + '\n' + o.address + (o.phone ? '\nTel. ' + o.phone : ''))}">${TSI.svg('copy')}Copiar</button></div>
      ${o.phone ? `<p class="muted" style="margin:6px 0 0">Tel. ${esc(o.phone)} · ${esc(o.email)}</p>` : `<p class="muted" style="margin:6px 0 0">${esc(o.email)}</p>`}</div>
    <div class="blk"><h3>PEDIDO</h3>${(o.items || []).map(i => { const p = C.PRODUCTS.find(x => x.id === i.id); return `<div class="line"><span>${i.qty} × ${esc(prodName(i.id))}</span><span>${p ? money(p.price * i.qty) : ''}</span></div>`; }).join('')}
      <div class="line muted"><span>Acabado</span><span>${esc(o.finish || '—')}</span></div>
      <div class="line"><span style="display:flex;gap:6px;align-items:center">${TSI.svg(ic)}${pm}</span><b style="font-size:18px">${money(o.total)}</b></div>
      ${o.vat ? `<div class="line muted"><span>Factura a</span><span>${esc(o.vat)}</span></div>` : ''}</div>
    <div class="blk">${actions}</div>`;
  const d = $('#sheet'); d.classList.remove('closing'); if (!d.open) d.showModal();
  $('#close').onclick = close;
  d.querySelectorAll('[data-copy]').forEach(b => b.onclick = () => navigator.clipboard.writeText(b.dataset.copy).then(() => toast('Dirección copiada')));
  d.querySelectorAll('[data-do]').forEach(b => b.onclick = () => act(o, b.dataset.do, b));
}
function close() { const d = $('#sheet'); d.classList.add('closing'); setTimeout(() => { d.close(); d.classList.remove('closing'); }, 200); history.replaceState(null, '', location.pathname + location.search); current = null; }
$('#sheet').addEventListener('click', (e) => { if (e.target === $('#sheet')) close(); });
$('#sheet').addEventListener('cancel', (e) => { e.preventDefault(); close(); });
async function act(o, status, btn) {
  if (status === 'cancelled' && !confirm(`¿Cancelar el pedido ${o.ref}?`)) return;
  const patch = { status };
  if (status === 'shipped') { const t = ($('#trk') || {}).value; if (t !== undefined) patch.tracking = t.trim(); }
  btn.disabled = true;
  try {
    await TS.updateOrder(o.ref, patch); Object.assign(o, patch);
    toast({ paid: 'Marcado como pagado', shipped: 'Marcado como enviado', cancelled: 'Pedido cancelado' }[status]);
    render(); open(o);
    if (status === 'paid' || status === 'shipped') setTimeout(() => { if (confirm('¿Avisar al cliente por email ahora?')) location.href = mail(o, status === 'paid' ? 'paid' : 'ship'); }, 250);
  } catch (e) { btn.disabled = false; toast('No se pudo guardar: ' + e.message); }
}
$('#reload').onclick = async () => { const s = $('#reload').firstElementChild; s.animate([{ transform: 'rotate(0)' }, { transform: 'rotate(360deg)' }], { duration: 500, easing: 'cubic-bezier(.23,1,.32,1)' }); await load(true); toast('Actualizado'); };
boot();
</script>
</body>
</html>
